name: Create scoring labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - ".github/workflows/create-scoring-labels.yml"

permissions:
  issues: write

jobs:
  create-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Criticality, Complexity, and Impact labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          for kind in Criticality Complexity Impact; do
            for n in 1 2 3 4 5; do
              name="${kind}: ${n}"
              if gh label list --repo "$repo" --json name --jq ".[] | select(.name==\"$name\") | .name" | grep -qxF "$name"; then
                echo "skip (exists): $name"
              else
                gh label create "$name" --repo "$repo" --color ededed
                echo "created: $name"
              fi
            done
          done
