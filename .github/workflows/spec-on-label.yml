# When `spec required` (or `spec-required`) is applied to an issue, start a
# spec pass that follows `.cursor/prompts/spec.md`.
#
# Uses repo secrets `CURSOR_AUTOMATION_WEBHOOK_URL` and
# `CURSOR_AUTOMATION_WEBHOOK_TOKEN`. Do not commit tokens. `CURSOR_API_KEY`
# is not required.
#
# One-time Automations UI (cursor.com/automations):
# 1. Open the automation whose webhook URL is stored in
#    `CURSOR_AUTOMATION_WEBHOOK_URL` (or create one: trigger = Webhook).
# 2. Repository: horribleCodes/gardener, starting branch main. The agent
#    must clone this repo (not "no repository") so it can open a draft PR.
# 3. Set the automation prompt to exactly:
#
#        Treat the webhook JSON `context` field as your full instruction.
#        Follow `.cursor/prompts/spec.md` for GitHub issue `issue.number`
#        on horribleCodes/gardener. Fresh branch from current origin/main.
#        Open a draft pull request. Link it with Related to #N (or Closes /
#        Fixes when this spec is meant to complete the issue). Do not
#        implement the plan. Do not spec other issues. Do not put personal
#        names or assistant product names on GitHub.
#
# 4. Save. Copy webhook URL + API key into the two GitHub secrets above
#    if they are not already set.
# Native Automations “Issue label changed” can also point at the same prompt
# if the UI exposes it; this workflow remains the in-repo trigger.

name: Spec on label

on:
  issues:
    types: [labeled]

concurrency:
  group: spec-on-label-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  start-spec:
    if: >
      github.event.issue.pull_request == null &&
      (github.event.label.name == 'spec required' ||
       github.event.label.name == 'spec-required')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Start spec pass
        id: start
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_AUTOMATION_WEBHOOK_URL: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_URL }}
          CURSOR_AUTOMATION_WEBHOOK_TOKEN: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/start-spec-pass.mjs < "$GITHUB_EVENT_PATH" | tee /tmp/spec-pass.json
          {
            echo "result<<SPEC_PASS_EOF"
            cat /tmp/spec-pass.json
            echo "SPEC_PASS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Note on the issue
        if: ${{ !fromJSON(steps.start.outputs.result).skipped }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.start.outputs.result }}
        run: |
          set -euo pipefail
          body="A spec pass was started for this issue (see \`.cursor/prompts/spec.md\`)."
          url=$(node -e 'const r=JSON.parse(process.env.RESULT||"{}"); process.stdout.write(r.agentUrl||"")')
          if [ -n "$url" ]; then
            body="${body} Agent: ${url}"
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "$body"
