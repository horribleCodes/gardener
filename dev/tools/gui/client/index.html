<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gardener dev GUI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <strong>Gardener dev GUI</strong>
        <span class="hint">localhost only · see README in repo under dev/tools/gui</span>
      </div>
      <div class="controls">
        <span id="status" class="badge">Stopped</span>
        <label class="db-label">
          DB path
          <input id="db-path" type="text" spellcheck="false" />
        </label>
        <button id="btn-save-path" type="button">Save path</button>
        <button id="btn-start" type="button">Start MCP</button>
        <button id="btn-stop" type="button">Stop MCP</button>
      </div>
    </header>
    <nav class="tabs" role="tablist">
      <button type="button" data-tab="tools" class="active">Tools</button>
      <button type="button" data-tab="resources">Resources</button>
      <button type="button" data-tab="prompts">Prompts</button>
      <button type="button" data-tab="sql">SQL</button>
    </nav>
    <main id="panel" class="panel"></main>
    <aside id="log-drawer" class="log-drawer">
      <div class="log-header">
        <strong>Traffic log</strong>
        <div class="filters">
          <button type="button" data-filter="all" class="active">All</button>
          <button type="button" data-filter="mcp">MCP</button>
          <button type="button" data-filter="sql">SQL</button>
          <button type="button" data-filter="error">Errors</button>
        </div>
      </div>
      <div id="log-lines" class="log-lines"></div>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
